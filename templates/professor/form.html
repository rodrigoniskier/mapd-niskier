{% extends "base.html" %}
{% block title %}{{ titulo }} — MAPD Niskier{% endblock %}
{% block content %}<header class="page-header"><a class="back-link" href="javascript:history.back()">← Voltar</a><p class="eyebrow">Edição</p><h1>{{ titulo }}</h1></header><section class="form-panel"><form method="post" class="stack-form">{% csrf_token %}{% for field in form %}<label class="{% if field.field.widget.input_type == 'checkbox' %}check-label{% endif %}">{{ field.label }}{{ field }}{% if field.help_text %}<small class="help-text">{{ field.help_text|safe }}</small>{% endif %}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</label>{% endfor %}<div class="action-row"><button class="primary-btn" type="submit">Salvar</button><a class="ghost-btn" href="javascript:history.back()">Cancelar</a></div></form></section>{% endblock %}
