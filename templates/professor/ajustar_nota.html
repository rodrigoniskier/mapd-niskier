{% extends "base.html" %}
{% block content %}
<a class="back" href="{% url 'professor_dashboard' %}">← Voltar</a>
<section class="auth-wrap">
  <div class="auth-card wide">
    <p class="eyebrow">Ajuste auditável</p>
    <h1>{{ tentativa.aluno.nome_exibicao }}</h1>
    <p>{{ tentativa.tema.titulo }} • nota atual {{ tentativa.nota_total }}</p>
    <form method="post" class="stack">{% csrf_token %}{{ form.as_p }}<button class="btn primary" type="submit">Salvar alteração</button></form>
  </div>
</section>
{% endblock %}
